<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEVOT... — Maquette 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens (charte docs/design) ============ */
  :root {
    --bg-dark: #22262e;        /* fond écran de départ, panneaux de modale */
    --bg-game: #4a5062;        /* fond écran de jeu */
    --panel: #4a5062;          /* carte "New game" */
    --ink-black: #0b0f1a;      /* motifs boulons */
    --brown-dark: #2c1810;     /* cartes Fuel / Event */
    --brown-mid: #4e3a2a;      /* vague du bas */
    --grey-light: #a9afbb;     /* titre, case courante de la jauge */
    --grey-text: #b7bcc7;
    --white: #f3f3f3;
    --cyan: #2bb8c4;
    --green: #5fce5f;
    --pink: #ef5670;
    --orange: #d98b43;
    --tan: #d39b6a;            /* jauge, bouton envoyer */
    --yellow: #fbbf24;
    --line: #4a5062;
    --radius-lg: 28px;
    --cell: clamp(40px, calc((100dvh - 290px) / 10), 52px); /* hauteur case jauge = hauteur bouton = espace */
    --shadow: 3px 8px 5px rgba(0,0,0,.55);
    --radius-md: 10px;
    --font: "Jersey 10", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #15181e;
    font-family: var(--font);
    color: var(--white);
    -webkit-font-smoothing: none;
    font-synthesis: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ============ Colonne mobile ============ */
  .app {
    position: relative;
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: var(--bg-game);
    isolation: isolate;
  }
  .app.is-start { background: var(--bg-dark); }

  /* Bande de boulons en haut */
  .top-strip {
    height: 56px;
    background-image: url("docs/assets/trace%20horizontale.png");
    background-repeat: repeat-x;
    background-size: auto 100%;
    opacity: .45;
  }
  .is-start .top-strip { opacity: .14; }

  /* Traces de l'accueil (asset "trace accueil", utilisé deux fois) */
  .start-traces { position: absolute; inset: 0; z-index: -1; pointer-events: none; display: none; overflow: hidden; }
  .is-start .start-traces { display: block; }
  .start-traces img { position: absolute; left: 0; width: 100%; height: auto; filter: brightness(.22); }
  .start-traces .t1 { top: 17%; }
  .start-traces .t2 { top: 54%; left: -10%; width: 120%; }

  /* Icônes assets */
  .corner img { position: absolute; right: 4px; bottom: 4px; height: 17px; width: auto; }
  .warn-yellow { filter: brightness(0) saturate(100%) invert(79%) sepia(61%) saturate(1200%) hue-rotate(352deg) brightness(102%); }
  .trace-diag { position: absolute; pointer-events: none; width: 150%; left: -20%; top: -10%; }

  .game-title {
    margin: 14px 0 0;
    text-align: center;
    font-size: 65px;
    font-weight: 400;
    letter-spacing: 2px;
    color: var(--grey-light);
    line-height: 1;
  }

  /* Motifs de fond (écran de départ) */
  .bolts-bg {
    position: absolute; inset: 0; z-index: -1; pointer-events: none;
    display: none;
  }
  .is-start .bolts-bg { display: block; }

  /* ============ Écran de jeu ============ */
  .game {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 22px;
    padding: 34px 16px 0;
    position: relative;
    z-index: 1;
  }
  .gauge-label {
    grid-column: 1 / -1;
    color: var(--cyan);
    font-size: 26px;
    font-weight: 400;
    margin: 0 0 10px;
  }
  .gauge {
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: visible;
    box-shadow: var(--shadow);
  }
  .gauge-cell {
    height: var(--cell);
    background: var(--tan);
    border-bottom: 2px solid #c9ccd3;
    color: #22262e;
    font-weight: 400;
    font-size: 19px;
    display: flex; align-items: center;
    padding-left: 10px;
    transition: background .35s ease, color .35s ease;
  }
  .gauge-cell.is-top { border-radius: 8px 8px 0 0; }
  .gauge-cell.is-bottom { border-radius: 0 0 8px 8px; border-bottom: 0; }
  .gauge-cell.is-empty { background: #3a3f4e; color: #6b7183; }
  .gauge-cell.is-current { background: var(--grey-light); color: #22262e; position: relative; }
  .gauge-drop {
    position: absolute; width: 86px; right: -18px;
    transition: top .45s cubic-bezier(.3,1.4,.6,1);
    pointer-events: none;
  }
  .gauge-zero { color: var(--pink); font-size: 17px; margin-top: 8px; text-align: center; }

  /* Grille calée sur les cases de la jauge : 1 bouton = 1 case, 1 espace = 1 case */
  .actions { display: grid; grid-template-rows: repeat(10, var(--cell)); }
  .actions > :nth-child(1) { grid-row: 1; }
  .actions > :nth-child(2) { grid-row: 3; }
  .actions > :nth-child(3) { grid-row: 5; }
  .actions > :nth-child(4) { grid-row: 7; }
  .actions > :nth-child(5) { grid-row: 9; }
  .card-btn {
    position: relative;
    height: 100%;
    border: 0;
    border-radius: 6px;
    background: var(--bg-dark);
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 400;
    white-space: nowrap;
    padding: 0 26px 0 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .08s;
  }
  .card-btn:active { transform: translateY(2px); }
  .card-btn .corner {
    position: absolute; right: 0; bottom: 0; width: 40px; height: 40px;
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
  .card-btn .corner svg { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; }
  .btn-question { color: var(--green); }
  .btn-question .corner { background: var(--green); }
  .btn-fuel { color: var(--tan); }
  .btn-fuel .corner { background: var(--tan); }
  .btn-story { color: var(--orange); }
  .btn-story .corner { background: var(--orange); }
  .btn-undo { color: var(--grey-light); background: #2e333f; }
  .btn-undo .corner { background: var(--cyan); }
  .btn-end {
    height: 100%;
    border: 0; border-radius: 6px;
    background: var(--pink); color: #22262e;
    font-size: 26px; font-weight: 400;
    box-shadow: var(--shadow);
  }
  .spacer { flex: 1; min-height: 0; }

  .waves { position: absolute; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; }
  .waves svg { display: block; width: 100%; height: auto; }
  .is-start .waves, .is-start .game { display: none; }

  /* ============ Overlay / modales ============ */
  .overlay {
    position: fixed; top: 0; bottom: 0; left: 0; right: 0; z-index: 10;
    max-width: 480px; margin: 0 auto;
    display: none;
    padding: 150px 16px 24px;
    background: rgba(70, 76, 94, .35);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    overflow-y: auto;
  }
  .overlay.is-open { display: block; animation: fade .18s ease; }
  /* Listes : la modale tient dans la fenêtre, seule la liste défile */
  .overlay.is-fit { overflow: hidden; display: none; }
  .overlay.is-fit.is-open { display: flex; flex-direction: column; }
  .overlay.is-fit #modal { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .overlay.is-fit .panel { min-height: 0; display: flex; flex-direction: column; max-height: 100%; }
  .overlay.is-fit .card-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-right: -10px; padding-right: 10px; }
  .card-list::-webkit-scrollbar { width: 6px; }
  .card-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .overlay.is-plain { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

  .modal-top { display: flex; align-items: center; justify-content: space-between; height: 44px; margin-bottom: 18px; padding: 0 6px; }
  .icon-btn { background: none; border: 0; padding: 4px; width: 48px; height: 48px; display: grid; place-items: center; }
  .icon-btn svg { width: 36px; height: 36px; }
  .back-btn { background: none; border: 0; color: var(--grey-light); font-size: 24px; font-weight: 400; padding: 8px 4px; min-height: 48px; }

  .panel {
    background: var(--bg-dark);
    border-radius: var(--radius-lg);
    padding: 26px 22px 30px;
    box-shadow: 0 12px 24px rgba(0,0,0,.35);
    animation: pop .2s ease;
  }
  .panel-title { text-align: center; font-size: 32px; font-weight: 400; margin: 0 0 24px; }
  .t-green { color: var(--green); } .t-orange { color: var(--orange); } .t-yellow { color: var(--yellow); }
  .t-pink { color: var(--pink); } .t-cyan { color: var(--cyan); } .t-tan { color: var(--tan); }

  .search {
    width: 100%; height: 50px; border: 0; border-radius: 12px;
    background: var(--bg-game); color: var(--white);
    font: 400 22px var(--font); padding: 0 18px; margin-bottom: 12px;
    outline: none;
  }
  .search::placeholder { color: #a6abb8; }
  .search:focus { box-shadow: 0 0 0 2px var(--cyan); }

  .card-list { list-style: none; margin: 0; padding: 0; }
  .card-row {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 3px solid var(--line);
    color: var(--white); font: 400 22px/1.45 var(--font);
    padding: 20px 0 16px;
  }
  .card-row:hover .q, .card-row:focus-visible .q { color: var(--cyan); }
  .card-row .id { color: var(--orange); }
  .card-row .meta { display: flex; gap: 8px; margin-top: 8px; font-size: 17px; }
  .badge { padding: 2px 8px; border-radius: 6px; background: #343a48; color: var(--grey-light); }
  .badge.hints { color: var(--cyan); }
  .badge.right { color: var(--green); }
  .badge.false { color: var(--pink); }
  .card-row.is-answered { opacity: .42; }
  .card-row.is-answered .q { text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ============ Carte (détail) ============ */
  .card {
    position: relative;
    border-radius: 26px;
    background: var(--bg-dark);
    overflow: hidden;
    box-shadow: 0 12px 24px rgba(0,0,0,.4);
    animation: pop .2s ease;
  }
  .card.is-fuel { background: #212121; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 18px 6px 20px; }
  .card-title { font-size: clamp(26px, 9vw, 38px); white-space: nowrap; font-weight: 400; margin-top: 20px; letter-spacing: .5px; }
  .card-title .g { color: var(--grey-light); }
  .card-icon { width: 44px; }
  .code {
    position: relative;
    margin-left: 20px; border-left: 2px solid #3d4250;
    padding: 6px 14px 10px 0;
    font-size: 20px; line-height: 1;
  }
  .code-line { display: grid; grid-template-columns: 38px 1fr; align-items: baseline; min-height: 29px; padding: 6px 0; }
  .ln { color: #5a6070; text-align: center; font-size: 18px; }
  .q-text { color: var(--cyan); line-height: 1.45; }
  .is-fuel .q-text { color: #d9c7a3; }
  .kw { color: var(--pink); }
  .is-fuel .kw { color: #8b6b6b; }
  .opt { color: var(--grey-text); padding-left: 14px; position: relative; line-height: 1.4; }
  .opt::before { content: ""; position: absolute; left: -2px; top: .65em; width: 10px; height: 2px; background: var(--tan); margin-left: -6px; }
  .is-fuel .code-line.low .ln { color: var(--tan); }
  .card-wave { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; z-index: 0; pointer-events: none; }
  .card > *:not(.card-wave) { position: relative; z-index: 1; }

  .card-foot { border-top: 2px solid #3d4250; padding: 16px 20px 22px; min-height: 172px; position: relative; }
  .is-fuel .card-foot { border-top-color: var(--tan); }
  .tabs { display: flex; justify-content: space-between; padding-right: 40px; }
  .tab {
    background: none; border: 0; padding: 4px 0; min-height: 44px;
    font: 400 31px var(--font); color: var(--white); letter-spacing: .5px;
  }
  .tab.is-dim { color: #5f6472; }
  .tab.is-active { color: var(--cyan); }
  .tab small { font-size: 16px; font-weight: 400; color: var(--grey-light); margin-left: 4px; }
  .tab:disabled { cursor: not-allowed; }
  .hint-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 20px; line-height: 1.4; }
  .hint-list li { margin-bottom: 6px; animation: pop .2s ease; }
  .hint-list b { color: var(--orange); font-weight: 400; }
  .hint-help { color: #7d8394; font-size: 17px; margin-top: 10px; }
  .answer { color: var(--orange); font-size: 20px; text-align: center; margin: 10px 0 18px; font-weight: 400; }
  .answer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .ans-btn {
    position: relative; height: 54px; border: 0; border-radius: 8px;
    background: var(--bg-game); font-size: 29px; font-weight: 400; overflow: hidden;
    box-shadow: 0 5px 8px rgba(0,0,0,.35);
  }
  .ans-btn::after { content: ""; position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .ans-btn.right { color: var(--green); } .ans-btn.right::after { background: var(--green); }
  .ans-btn.false { color: var(--pink); } .ans-btn.false::after { background: var(--pink); }
  .ans-btn small { font-size: 17px; opacity: .8; }
  .ribbon {
    position: absolute; right: 0; bottom: 0; width: 126px; height: 126px; z-index: 0;
    background: var(--tan); clip-path: polygon(100% 0, 100% 100%, 0 100%);
    pointer-events: none;
  }
  .ribbon span {
    position: absolute; right: 2px; bottom: 34px; transform: rotate(-45deg);
    color: #fff; font-weight: 400; font-size: 26px; white-space: nowrap;
  }
  .card-foot.has-answers .ribbon { display: none; }

  /* ============ Carte Event ============ */
  .event-card { border-radius: 26px; overflow: hidden; box-shadow: 0 12px 24px rgba(0,0,0,.4); animation: pop .2s ease; position: relative; }
  .event-top { background: var(--brown-dark); padding: 26px 22px 30px; position: relative; min-height: 330px; overflow: hidden; }
  .event-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .event-title { color: var(--yellow); font-size: clamp(26px, 9vw, 36px); white-space: nowrap; font-weight: 400; margin-top: 22px; }
  .event-text { color: var(--grey-light); font-size: 25px; text-align: center; line-height: 1.5; margin: 60px 18px 0; position: relative; z-index: 1; font-weight: 400; }
  .bang { position: absolute; width: 40px; top: 120px; }
  .bang.l { left: 10px; } .bang.r { right: 10px; transform: scaleX(-1); }
  .event-bottom { background: var(--orange); height: 170px; display: grid; place-items: center; position: relative; overflow: hidden; }
  .event-effect { color: #fff; font-size: 58px; font-weight: 400; position: relative; z-index: 1; letter-spacing: 1px; }

  /* ============ Start ============ */
  .start-panel { background: var(--panel); border-radius: 30px; padding: 30px 0 30px; margin-top: clamp(150px, 34dvh, 300px); box-shadow: 0 10px 20px rgba(0,0,0,.35); animation: pop .25s ease; }
  .start-panel .panel-title { margin-bottom: 48px; }
  .field-label { display: block; color: var(--cyan); font-size: 26px; font-weight: 400; margin: 0 30px 12px; }
  .name-input {
    display: block; width: calc(100% - 60px); margin: 0 30px; height: 64px;
    border: 0; border-radius: 40px; background: var(--white);
    font: 400 24px var(--font); color: var(--bg-dark); padding: 0 24px;
    box-shadow: 0 6px 8px rgba(0,0,0,.35); outline: none;
  }
  .name-input:focus { box-shadow: 0 0 0 3px var(--cyan), 0 6px 8px rgba(0,0,0,.35); }
  .send-row { display: flex; align-items: center; margin-top: 64px; padding-right: 30px; }
  .send-row::before { content: ""; flex: 1; height: 4px; background: var(--tan); }
  .send-btn {
    width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--tan);
    display: grid; place-items: center; box-shadow: 0 4px 8px rgba(0,0,0,.35); margin-left: -2px;
  }
  .send-btn img { width: 44px; margin-left: 4px; }

  /* ============ Confirm / Recap ============ */
  .confirm-text { text-align: center; font-size: 24px; line-height: 1.45; color: var(--grey-light); margin: 0 4px 28px; }
  .row-btns { display: grid; gap: 14px; }
  .btn-solid { height: 54px; border: 0; border-radius: 8px; font-size: 24px; font-weight: 400; box-shadow: 0 5px 8px rgba(0,0,0,.35); }
  .btn-solid.pink { background: var(--pink); color: #22262e; }
  .btn-solid.grey { background: var(--bg-game); color: var(--grey-light); }
  .btn-solid.tan { background: var(--tan); color: #22262e; }

  .recap-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; gap: 12px; }
  .recap-name { color: var(--cyan); font-size: 24px; font-weight: 400; }
  .recap-fuel { text-align: right; }
  .recap-fuel .big { font-size: 48px; font-weight: 400; color: var(--tan); line-height: 1; }
  .recap-fuel small { color: var(--grey-light); font-size: 17px; display: block; }
  .recap-list { border-left: 2px solid #3d4250; margin: 0 0 24px; padding: 0; list-style: none; max-height: 46dvh; overflow-y: auto; }
  .recap-list li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 8px 0; font-size: 19px; align-items: baseline; }
  .recap-list .ln { font-size: 17px; }
  .recap-list .deck-q { color: var(--green); }
  .recap-list .deck-f { color: var(--tan); }
  .recap-list .delta { font-weight: 400; }
  .delta.neg { color: var(--pink); } .delta.pos { color: var(--green); } .delta.zero { color: var(--grey-light); }

  /* ============ Toast ============ */
  .toast {
    position: absolute; left: 50%; bottom: 28px; z-index: 30;
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--bg-dark); color: var(--white); border-left: 4px solid var(--cyan);
    padding: 12px 18px; border-radius: 8px; font-size: 19px; white-space: nowrap;
    box-shadow: 0 8px 16px rgba(0,0,0,.4);
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* ============ Panneau de maquette (hors app) ============ */
  .mock-tools { position: fixed; right: 12px; bottom: 12px; z-index: 100; font-family: var(--font); }
  .mock-toggle { background: #fff; color: #111; border: 0; border-radius: 20px; padding: 8px 14px; font: 400 16px var(--font); box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mock-menu { display: none; position: absolute; right: 0; bottom: 44px; width: 230px; background: #fff; color: #111; border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .mock-menu.is-open { display: block; }
  .mock-menu p { margin: 4px 6px 8px; font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: .05em; }
  .mock-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; font: 17px var(--font); color: #111; }
  .mock-menu button:hover { background: #eef0f4; }
  .mock-menu label { display: block; font-size: 16px; margin: 10px 8px 4px; }
  .mock-menu input[type=range] { width: calc(100% - 16px); margin: 0 8px 4px; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Traces de l'accueil (asset "trace accueil" x2) -->
  <div class="start-traces" aria-hidden="true">
    <img class="t1" src="docs/assets/trace%20accueil.png" alt="">
    <img class="t2" src="docs/assets/trace%20accueil.png" alt="">
  </div>

  <div class="top-strip" aria-hidden="true"></div>
  <h1 class="game-title">DEVOT...</h1>

  <!-- Écran de jeu (fond permanent) -->
  <main class="game" id="game">
    <p class="gauge-label">Your Fuel</p>

    <div>
      <div class="gauge" id="gauge" role="meter" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10" aria-label="Fuel">
        <!-- cellules générées -->
        <img class="gauge-drop" id="gaugeDrop" src="docs/assets/groupe%20de%20goute.png" alt="">
      </div>
    </div>

    <div class="actions">
      <button class="card-btn btn-question" data-open="list-question">Question Card
        <span class="corner"><svg viewBox="0 0 20 20"><text x="10" y="17" text-anchor="middle" font-family="Jersey 10, monospace" font-size="17" fill="#22262e">?</text></svg></span>
      </button>
      <button class="card-btn btn-fuel" data-open="list-fuel">Fuel Card
        <span class="corner"><img src="docs/assets/goute%20seul.png" alt=""></span>
      </button>
      <!-- Emplacement Event (= "Story Card" dans la charte) -->
      <button class="card-btn btn-story" data-open="list-story">Story Card
        <span class="corner"><img src="docs/assets/warning.png" alt=""></span>
      </button>
      <button class="card-btn btn-undo" id="undoBtn">↶ Undo
        <span class="corner"></span>
      </button>
      <button class="btn-end" data-open="confirm">End Game</button>
    </div>
  </main>

  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 480 230" preserveAspectRatio="none">
      <path d="M0 40 C 90 -10, 160 20, 230 60 C 320 110, 410 100, 480 50 L480 230 L0 230 Z" fill="#120e0c"/>
      <path d="M0 175 C 90 140, 170 160, 260 190 C 330 210, 390 160, 480 110 L480 230 L0 230 Z" fill="#4e3a2a"/>
    </svg>
  </div>

  <!-- Overlay unique : une seule modale visible à la fois -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div id="modal"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<!-- Outil de maquette (n'existera pas dans le vrai jeu) -->
<div class="mock-tools">
  <div class="mock-menu" id="mockMenu">
    <p>Aller à l'écran</p>
    <button data-go="start">1 · Start (New game)</button>
    <button data-go="game">2 · Écran de jeu</button>
    <button data-go="list-question">3 · Liste Question Card</button>
    <button data-go="card-question">4 · Détail question</button>
    <button data-go="card-question-hint">5 · Détail question — Hints</button>
    <button data-go="card-question-answer">6 · Détail question — Answers</button>
    <button data-go="list-fuel">7 · Liste Refuel Card</button>
    <button data-go="card-fuel">8 · Détail Refuel</button>
    <button data-go="list-story">9 · Liste Events Card</button>
    <button data-go="event-0">10 · Carte Event</button>
    <button data-go="undo">11 · Toast Undo</button>
    <button data-go="confirm">12 · Confirmation fin</button>
    <button data-go="recap">13 · Récapitulatif</button>
    <label for="gaugeRange">Jauge : <span id="gaugeVal">10</span>/10</label>
    <input type="range" id="gaugeRange" min="0" max="10" value="10">
  </div>
  <button class="mock-toggle" id="mockToggle">Maquette 3 ▴</button>
</div>

<script>
/* ===================== Contenu fictif ===================== */
const QUESTIONS = [
  { id: "032", q: "What is the HTML tag <h1> for?", opts: ["Create a link.", "Define the main heading.", "Insert an image.", "Make text italic."], answer: "B. Define the main heading.", penalty: 2, hints: ["It's about titles.", "There are six levels of it.", "Search engines love it."] },
  { id: "047", q: "What is the purpose of the HTML required attribute?", opts: ["Hide a field.", "Make a field mandatory.", "Disable a field.", "Style a field."], answer: "B. Make a field mandatory.", penalty: 1, hints: ["It's used in forms.", "The form won't submit without it."], state: { hints: 2 } },
  { id: "021", q: "What is the purpose of the HTML <footer> tag?", opts: ["Define the bottom section.", "Add a sidebar.", "Create a menu.", "Insert a video."], answer: "A. Define the bottom section.", penalty: 2, hints: ["Think of a page's feet.", "Often holds copyright info.", "Opposite of <header>."], state: { result: "right" } },
  { id: "011", q: "What is the purpose of the HTML <strong> tag?", opts: ["Underline text.", "Give text strong importance.", "Change the font.", "Center text."], answer: "B. Give text strong importance.", penalty: 3, hints: ["Browsers show it in bold.", "It carries meaning, not just style."], state: { result: "false" } },
  { id: "031", q: "What is the purpose of the HTML <br> tag?", opts: ["Create a horizontal line.", "Make text bold.", "Insert a line break.", "Create a new paragraph."], answer: "C. Insert a line break.", penalty: 2, hints: ["It's a self-closing tag.", "It moves what follows to the next line.", "Like pressing Enter in a poem."] },
  { id: "073", q: "What is the function of box-sizing: border-box?", opts: ["Add a border.", "Include padding and border in the width.", "Remove margins.", "Round the corners."], answer: "B. Include padding and border in the width.", penalty: 2, hints: ["It changes how width is computed.", "Padding no longer grows the box."] },
];
const FUELS = [
  { id: "001", q: "What is the purpose of the CSS overflow property?", opts: ["Change the element's color.", "Define the font family.", "Control what happens when content exceeds an element's box.", "Define the main heading of a page."], answer: "C. Control what happens when content exceeds the box.", penalty: 1, reward: 1, hints: ["Think about scrollbars.", "Values include hidden and auto.", "Content that doesn't fit."] },
  { id: "002", q: "Which CSS property changes the text color?", opts: ["font-color", "color", "text-style", "background"], answer: "B. color", penalty: 1, reward: 2, hints: ["It's the shortest possible name.", "Not background-color."], state: { hints: 1 } },
  { id: "003", q: "What does display: flex do?", opts: ["Hides the element.", "Turns the element into a flex container.", "Animates the element.", "Makes text bigger."], answer: "B. Turns it into a flex container.", penalty: 2, reward: 3, hints: ["It's a layout mode.", "Children line up in a row by default."], state: { result: "right" } },
  { id: "009", q: "What does the CSS property margin: auto do on a block?", opts: ["Adds a border.", "Centers it horizontally.", "Hides it.", "Makes it bold."], answer: "B. Centers it horizontally.", penalty: 1, reward: 1, hints: ["It splits free space.", "Works with a fixed width."] },
  { id: "012", q: "Which unit is relative to the root font size?", opts: ["px", "em", "rem", "vh"], answer: "C. rem", penalty: 2, reward: 2, hints: ["R stands for root.", "It looks like em."] },
  { id: "007", q: "What does the CSS z-index property control?", opts: ["Zoom level.", "Stacking order.", "Font size.", "Element width."], answer: "B. Stacking order.", penalty: 1, reward: 2, hints: ["Think of layers.", "Higher comes in front."] },
];
const EVENTS = [
  { id: "001", text: "A bolt comes loose, and you lose 2 liters of fuel.", effect: "-2 FUEL" },
  { id: "002", text: "You've discovered a hidden energy reserve! Gain 3 Fuel.", effect: "+3 FUEL" },
  { id: "004", text: "A friendly mechanic tightens your bolts. Gain 1 Fuel.", effect: "+1 FUEL" },
  { id: "005", text: "A sandstorm slows everyone down. All players move back 1 space.", effect: "Back 1 space" },
  { id: "003", text: "A short circuit has disrupted your system! You lose your next turn.", effect: "No next turn" },
];
const RECAP = [
  ["q", "Question 031 — Hint 1", -1], ["q", "Question 031 — Hint 2", -1], ["q", "Question 031 — False", -2],
  ["f", "Refuel 003 — Right", +3], ["q", "Question 021 — Right", 0], ["q", "Question 011 — Hint 1", -1],
  ["q", "Question 011 — False", -3], ["f", "Refuel 002 — Hint 1", -1], ["f", "Refuel 007 — Right", +2],
];

/* ===================== Helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const app = $("#app"), overlay = $("#overlay"), modal = $("#modal");
let gaugeValue = 10;

const ICON_X = color => `<svg viewBox="0 0 40 40"><path d="M6 6 L34 34 M34 6 L6 34" stroke="${color}" stroke-width="6" stroke-linecap="round"/></svg>`;
const HTML5 = `<svg class="card-icon" viewBox="0 0 60 80"><text x="30" y="11" text-anchor="middle" font-family="Jersey 10, monospace" font-size="12" fill="#8b909c">HTML</text><path d="M3 16 H57 L52 70 L30 77 L8 70 Z" fill="#b7472a"/><path d="M30 20 H53 L49 67 L30 72 Z" fill="#c9553a"/><path d="M18 28 H43 L42 35 H26 L27 42 H41 L39 60 L30 63 L21 60 L20 52 H27 L27 55 L30 56 L33 55 L34 48 H20 Z" fill="#c7c9cf"/></svg>`;
const DROPS = `<img class="card-icon" src="docs/assets/groupe%20de%20goute.png" alt="" style="width:60px">`;
const WARN = `<img class="warn-yellow" src="docs/assets/warning.png" alt="" style="width:52px">`;
const BANG = `<svg viewBox="0 0 60 60"><path d="M22 6 L38 0 L52 44 L42 48 Z" fill="#fbbf24"/><path d="M6 32 L18 26 L32 50 L28 52 Z" fill="#fbbf24"/></svg>`;
const BOLTS_ORANGE = `<img class="trace-diag" src="docs/assets/trace%20diagonale.png" alt="" style="opacity:.3;top:-75%;left:-30%">`;
const BOLTS_BROWN = `<img class="trace-diag" src="docs/assets/trace%20diagonale.png" alt="" style="opacity:.07;top:10%">`;

/* ===================== Jauge ===================== */
function renderGauge() {
  const g = $("#gauge");
  g.querySelectorAll(".gauge-cell").forEach(c => c.remove());
  const drop = $("#gaugeDrop");
  for (let n = 10; n >= 1; n--) {
    const cell = document.createElement("div");
    cell.className = "gauge-cell" + (n > gaugeValue ? " is-empty" : "") + (n === gaugeValue ? " is-current" : "") + (n === 10 ? " is-top" : "") + (n === 1 ? " is-bottom" : "");
    cell.textContent = n;
    g.insertBefore(cell, drop);
  }
  g.setAttribute("aria-valuenow", gaugeValue);
  const cellH = g.querySelector(".gauge-cell").offsetHeight;
  drop.style.top = gaugeValue === 0 ? (10 * cellH - 40) + "px" : ((10 - gaugeValue) * cellH - 34) + "px";
  $("#gaugeVal").textContent = gaugeValue;
  $("#gaugeRange").value = gaugeValue;
}

/* ===================== Modales ===================== */
function openModal(html, { plain = false, top = 150, fit = false } = {}) {
  modal.innerHTML = html;
  overlay.classList.add("is-open");
  overlay.classList.toggle("is-plain", plain);
  overlay.classList.toggle("is-fit", fit);
  overlay.style.paddingTop = top + "px";
  overlay.scrollTop = 0;
}
function closeModal() { overlay.classList.remove("is-open"); modal.innerHTML = ""; }

function topBar({ color, back }) {
  return `<div class="modal-top">
    ${back ? `<button class="back-btn" data-open="${back}">← Back</button>` : `<span></span>`}
    <button class="icon-btn" data-close aria-label="Close">${ICON_X(color)}</button>
  </div>`;
}

function listView(kind) {
  const conf = {
    question: { title: "Question Card", cls: "t-green", color: "#5fce5f", items: QUESTIONS, card: "card-question" },
    fuel:     { title: "Refuel Card",   cls: "t-orange", color: "#d98b43", items: FUELS, card: "card-fuel" },
    story:    { title: "Events Card",   cls: "t-yellow", color: "#fbbf24", items: EVENTS, card: "event" },
  }[kind];
  const rows = conf.items.map((c, i) => {
    const s = c.state || {};
    const total = c.hints ? c.hints.length : 0;
    const meta = [];
    if (s.hints) meta.push(`<span class="badge hints">${s.hints}/${total} hints</span>`);
    if (s.result === "right") meta.push(`<span class="badge right">✓ Right</span>`);
    if (s.result === "false") meta.push(`<span class="badge false">✗ False</span>`);
    const target = kind === "story" ? `event-${i}` : `${conf.card}-${i}`;
    return `<li><button class="card-row ${s.result ? "is-answered" : ""}" data-open="${target}">
      <span class="id">&lt;${esc(c.id)}&gt;</span> <span class="q">${esc(c.q || c.text)}</span>
      ${meta.length ? `<span class="meta">${meta.join("")}</span>` : ""}
    </button></li>`;
  }).join("");
  openModal(`${topBar({ color: conf.color })}
    <section class="panel">
      <h2 class="panel-title ${conf.cls}">&lt; ${conf.title} &gt;</h2>
      <input class="search" type="search" inputmode="numeric" placeholder="search by ID or Name..." aria-label="Search card by ID">
      <ul class="card-list">${rows}</ul>
    </section>`, { top: 110, fit: true });
}

function cardView(kind, idx, tab = null, revealed = null) {
  const isFuel = kind === "fuel";
  const c = (isFuel ? FUELS : QUESTIONS)[idx];
  const shown = revealed ?? ((c.state && c.state.hints) || 0);
  const answered = c.state && c.state.result;
  // découpe de la question en 2 lignes de "code"
  const words = c.q.split(" "); const half = Math.ceil(words.length / 2);
  const lines = [
    `<span class="q-text">&lt; ${esc(words.slice(0, half).join(" "))}</span>`,
    `<span class="q-text">${esc(words.slice(half).join(" "))} &gt;</span>`,
    `<span class="kw">Answer</span> <span style="color:#8b909c">: {</span>`,
    ...c.opts.map(o => `<span class="opt">${esc(o)}</span>`),
    `<span style="color:#8b909c">}</span>`,
  ];
  while (lines.length < 11) lines.push("");
  const code = lines.map((l, i) => `<div class="code-line ${i >= 9 ? "low" : ""}"><span class="ln">${i + 1}</span><span>${l}</span></div>`).join("");

  const left = c.hints.length - shown;
  let foot = "";
  if (tab === "hint") {
    foot = `<ul class="hint-list">${c.hints.slice(0, shown).map((h, i) => `<li><b>Hint ${i + 1}:</b> ${esc(h)}</li>`).join("")}</ul>
      <p class="hint-help">${left > 0 ? `Tap HINT to reveal the next one (−1 fuel).` : `All hints revealed.`}</p>`;
  } else if (tab === "answer") {
    foot = `<p class="answer">${esc(c.answer)}</p>
      <div class="answer-btns">
        <button class="ans-btn right" data-answer>Right ${isFuel ? `<small>(+${c.reward})</small>` : ``}</button>
        <button class="ans-btn false" data-answer>False <small>(−${c.penalty})</small></button>
      </div>`;
  }
  const ribbon = isFuel ? `+${c.reward} FUEL` : `-${c.penalty} FUEL`;
  const wave = isFuel ? `<svg class="card-wave" viewBox="0 0 400 300" preserveAspectRatio="none"><path d="M0 70 C 60 60, 110 90, 170 100 C 230 110, 220 20, 300 5 C 340 -2, 380 10, 400 20 L400 300 L0 300 Z" fill="#2c1810"/></svg>` : "";

  openModal(`${topBar({ color: isFuel ? "#d98b43" : "#5fce5f", back: isFuel ? "list-fuel" : "list-question" })}
    <article class="card ${isFuel ? "is-fuel" : ""}">
      ${wave}
      <header class="card-head">
        <div class="card-title">${isFuel
          ? `<span class="g">DEVOT...</span> <span style="color:#a89585">REFUEL.${parseInt(c.id, 10)}</span>`
          : `<span class="g">&lt;!</span> <span class="t-pink">QUESTION</span> <span class="g">:</span> <span class="t-tan">${parseInt(c.id, 10)}</span> <span class="g">&gt;</span>`}
        </div>
        ${isFuel ? DROPS : HTML5}
      </header>
      <div class="code">${code}</div>
      <footer class="card-foot ${tab === "answer" ? "has-answers" : ""}">
        <div class="tabs">
          <button class="tab ${tab === "hint" ? "is-active" : tab ? "is-dim" : ""}" data-tab="hint" data-shown="${shown}" ${answered || left === 0 && tab === "hint" ? "" : ""}>HINT<small>${left > 0 ? `(${left} left)` : ""}</small></button>
          <button class="tab ${tab === "answer" ? "is-active" : tab ? "is-dim" : ""}" data-tab="answer" data-shown="${shown}">ANSWERS</button>
        </div>
        ${foot}
        <div class="ribbon"><span>${ribbon}</span></div>
      </footer>
    </article>`, { top: 100 });
  modal.dataset.kind = kind; modal.dataset.idx = idx;
}

function eventView(idx) {
  const e = EVENTS[idx];
  openModal(`${topBar({ color: "#fbbf24", back: "list-story" })}
    <article class="event-card">
      <div class="event-top">
        ${BOLTS_BROWN}
        <div class="event-head" style="position:relative;z-index:1"><div class="event-title">DEVOT... EVENTS</div>${WARN}</div>
        <span class="bang l">${BANG}</span><span class="bang r">${BANG}</span>
        <p class="event-text">${esc(e.text)}</p>
      </div>
      <div class="event-bottom">${BOLTS_ORANGE}<div class="event-effect">${esc(e.effect)}</div></div>
    </article>`, { top: 100 });
}

function startView() {
  app.classList.add("is-start");
  openModal(`<section class="start-panel">
      <h2 class="panel-title t-pink">&lt; New game &gt;</h2>
      <label class="field-label" for="sessionName">Group Name</label>
      <input class="name-input" id="sessionName" maxlength="40" autocomplete="off" value="">
      <div class="send-row"><button class="send-btn" data-start aria-label="Start game"><img src="docs/assets/Navigation.png" alt=""></button></div>
    </section>`, { plain: true, top: 0 });
}

function confirmView() {
  openModal(`${topBar({ color: "#ef5670" })}
    <section class="panel">
      <h2 class="panel-title t-pink">&lt; End game &gt;</h2>
      <p class="confirm-text">Are you sure you want to end the game?</p>
      <div class="row-btns">
        <button class="btn-solid pink" data-open="recap">Yes, end the game</button>
        <button class="btn-solid grey" data-close>Cancel</button>
      </div>
    </section>`, { top: 220 });
}

function recapView() {
  const items = RECAP.map(([d, label, delta], i) => `<li>
      <span class="ln">${i + 1}</span>
      <span class="${d === "q" ? "deck-q" : "deck-f"}">${esc(label)}</span>
      <span class="delta ${delta < 0 ? "neg" : delta > 0 ? "pos" : "zero"}">${delta > 0 ? "+" : delta < 0 ? "−" : ""}${Math.abs(delta)}</span>
    </li>`).join("");
  openModal(`<section class="panel" style="margin-top:0">
      <h2 class="panel-title t-pink">&lt; Game over &gt;</h2>
      <div class="recap-head">
        <div><small style="color:#7d8394;font-size:16px">Group</small><div class="recap-name">Table of Alice</div></div>
        <div class="recap-fuel"><small>Final fuel</small><span class="big">5</span><small>/ 10</small></div>
      </div>
      <ol class="recap-list">${items}</ol>
      <button class="btn-solid tan" style="width:100%" data-open="start">Start a new game</button>
    </section>`, { top: 120 });
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("is-on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("is-on"), 2200);
}

/* ===================== Navigation ===================== */
function go(target) {
  if (target !== "start") app.classList.remove("is-start");
  if (target === "start") return startView();
  if (target === "game") return closeModal();
  if (target === "confirm") return confirmView();
  if (target === "recap") return recapView();
  if (target === "undo") { closeModal(); return toast("Undone: Question 031 – False (−2)"); }
  if (target.startsWith("list-")) return listView(target.slice(5));
  if (target.startsWith("event-")) return eventView(+target.slice(6));
  if (target === "card-question-hint") return cardView("question", 4, "hint", 2);
  if (target === "card-question-answer") return cardView("question", 4, "answer");
  if (target === "card-question") return cardView("question", 4);
  if (target === "card-fuel") return cardView("fuel", 0);
  const m = target.match(/^card-(question|fuel)-(\d+)$/);
  if (m) return cardView(m[1], +m[2]);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-open],[data-close],[data-tab],[data-answer],[data-start],[data-go]");
  if (!el) return;
  if (el.dataset.go) { $("#mockMenu").classList.remove("is-open"); return go(el.dataset.go); }
  if (el.hasAttribute("data-close")) return closeModal();
  if (el.dataset.open) return go(el.dataset.open);
  if (el.hasAttribute("data-start")) return go("game");
  if (el.hasAttribute("data-answer")) return closeModal();
  if (el.dataset.tab) {
    const kind = modal.dataset.kind, idx = +modal.dataset.idx;
    const c = (kind === "fuel" ? FUELS : QUESTIONS)[idx];
    let shown = +el.dataset.shown;
    const onHintAlready = el.classList.contains("is-active");
    if (el.dataset.tab === "hint" && (onHintAlready || shown === 0) && shown < c.hints.length) shown++;
    return cardView(kind, idx, el.dataset.tab, shown);
  }
});
$("#undoBtn").addEventListener("click", () => go("undo"));
overlay.addEventListener("click", e => {
  if (e.target === overlay && !app.classList.contains("is-start") && !$(".recap-list")) closeModal();
});

/* Outil maquette */
$("#mockToggle").addEventListener("click", () => $("#mockMenu").classList.toggle("is-open"));
$("#gaugeRange").addEventListener("input", e => { gaugeValue = +e.target.value; renderGauge(); });

renderGauge();
window.addEventListener("resize", renderGauge);
document.fonts && document.fonts.ready.then(renderGauge);
go("start");
</script>
</body>
</html>
