<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22262e">
  <title>DEVOT...</title>

  <link rel="preload" href="fonts/jersey-10.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/event-card.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app" data-screen="start">
    <!-- Decorative background (start screen only) -->
    <div class="app__traces" aria-hidden="true">
      <img class="app__trace app__trace--top" src="assets/trace-home.png" alt="">
      <img class="app__trace app__trace--bottom" src="assets/trace-home.png" alt="">
    </div>

    <header class="app__header">
      <div class="app__strip" aria-hidden="true"></div>
      <h1 class="app__title">DEVOT...</h1>
    </header>

    <!-- Game screen: always rendered behind the modals -->
    <main class="game">
      <p class="game__label" id="gauge-label">Your Fuel</p>

      <div class="gauge" id="gauge" role="meter"
           aria-labelledby="gauge-label" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10">
        <img class="gauge__drops" src="assets/drops-group.png" alt="">
      </div>

      <nav class="actions" aria-label="Game actions">
        <button class="action-btn action-btn--question" type="button" data-action="open-deck" data-deck="movement">
          Question Card
          <span class="action-btn__corner" aria-hidden="true"><span class="action-btn__glyph">?</span></span>
        </button>
        <button class="action-btn action-btn--fuel" type="button" data-action="open-deck" data-deck="fuel">
          Fuel Card
          <span class="action-btn__corner" aria-hidden="true"><img src="assets/drop.png" alt=""></span>
        </button>
        <button class="action-btn action-btn--event" type="button" data-action="open-deck" data-deck="event" id="event-button">
          Story Card
          <span class="action-btn__corner" aria-hidden="true"><img src="assets/warning.png" alt=""></span>
        </button>
        <button class="action-btn action-btn--undo" type="button" data-action="undo">
          ↶ Undo
          <span class="action-btn__corner" aria-hidden="true"></span>
        </button>
        <button class="action-btn action-btn--end" type="button" data-action="end-game">End Game</button>
      </nav>
    </main>

    <div class="app__waves" aria-hidden="true">
      <svg viewBox="0 0 480 230" preserveAspectRatio="none">
        <path d="M0 40 C 90 -10, 160 20, 230 60 C 320 110, 410 100, 480 50 L480 230 L0 230 Z" fill="#120e0c"/>
        <path d="M0 175 C 90 140, 170 160, 260 190 C 330 210, 390 160, 480 110 L480 230 L0 230 Z" fill="#4e3a2a"/>
      </svg>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Single modal: only one is visible at a time, its content is swapped by views -->
  <dialog class="modal" id="modal" aria-label="Dialog"></dialog>
</body>
</html>
